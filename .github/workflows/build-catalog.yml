name: Build catalog

# Rebuilds catalog.json from every <name>/info.ts and commits it back.
on:
  push:
    branches:
      - 'main'

permissions:
  contents: write

concurrency:
  group: build-catalog-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild catalog.json
        run: npx --yes tsx@4 scripts/build-catalog.mts

      - name: Commit catalog.json
        run: |
          if git diff --quiet -- catalog.json; then
            echo 'catalog.json is already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          git commit -m 'chore: rebuild catalog.json from info.ts files'
          git push origin HEAD:${{ github.ref_name }}
